<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin - Lokasi Undangan
    </title>


    <!-- LEAFLET CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background: #f5f5f5;

            color: #333;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background: #3e3028;

            color: white;

            padding: 20px;

            text-align: center;

        }


        header h1 {

            font-size: 25px;

            margin-bottom: 5px;

        }


        header p {

            opacity: 0.8;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 95%;

            max-width: 1200px;

            margin: 25px auto;

        }


        /* =========================
           STATISTIC
        ========================= */

        .statistics {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 15px;

            margin-bottom: 20px;

        }


        .card {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.08);

        }


        .card-title {

            color: #777;

            font-size: 14px;

            margin-bottom: 10px;

        }


        .card-value {

            font-size: 32px;

            font-weight: bold;

            color: #3e3028;

        }


        /* =========================
           MAP
        ========================= */

        .map-container {

            background: white;

            padding: 15px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.08);

            margin-bottom: 20px;

        }


        .map-container h2 {

            margin-bottom: 15px;

            font-size: 20px;

        }


        #map {

            width: 100%;

            height: 500px;

            border-radius: 10px;

        }


        /* =========================
           TABLE
        ========================= */

        .table-container {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.08);

            overflow-x: auto;

        }


        .table-container h2 {

            margin-bottom: 15px;

            font-size: 20px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 650px;

        }


        th,
        td {

            padding: 12px;

            border-bottom:
                1px solid #ddd;

            text-align: left;

        }


        th {

            background: #f0ebe6;

        }


        tr:hover {

            background: #fafafa;

        }


        /* =========================
           BUTTON
        ========================= */

        .button {

            display: inline-block;

            padding:
                10px 18px;

            margin-bottom: 15px;

            border: none;

            border-radius: 7px;

            background: #6b5142;

            color: white;

            cursor: pointer;

        }


        .button:hover {

            background: #4e392f;

        }


        /* =========================
           STATUS
        ========================= */

        #status {

            margin-bottom: 15px;

            color: #666;

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            #map {

                height: 400px;

            }


            header h1 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            Dashboard Lokasi Undangan
        </h1>

        <p>
            Data lokasi yang diberikan
            dengan izin pengguna
        </p>

    </header>


    <!-- =========================
         CONTENT
    ========================= -->

    <div class="container">


        <!-- STATISTICS -->

        <div class="statistics">


            <div class="card">

                <div class="card-title">

                    Total Data Lokasi

                </div>


                <div
                    id="totalLocations"
                    class="card-value">

                    0

                </div>

            </div>


            <div class="card">

                <div class="card-title">

                    Status Server

                </div>


                <div
                    id="serverStatus"
                    class="card-value">

                    -

                </div>

            </div>


        </div>


        <!-- MAP -->

        <div class="map-container">

            <h2>
                Peta Lokasi
            </h2>


            <button
                class="button"
                onclick="loadLocations()">

                🔄 Refresh Data

            </button>


            <div id="status">

                Memuat data...

            </div>


            <div id="map"></div>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <h2>
                Data Lokasi
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            Latitude
                        </th>

                        <th>
                            Longitude
                        </th>

                        <th>
                            Waktu
                        </th>

                    </tr>

                </thead>


                <tbody id="locationTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- LEAFLET JAVASCRIPT -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>


        /*
         * ======================================
         * INISIALISASI PETA
         * ======================================
         */

        let map =
            L.map("map")
             .setView(
                 [-6.2, 106.816666],
                 10
             );


        /*
         * ======================================
         * OPENSTREETMAP
         * ======================================
         */

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap contributors"

            }

        ).addTo(map);


        /*
         * ======================================
         * LAYER MARKER
         * ======================================
         */

        let markerLayer =
            L.layerGroup().addTo(map);


        /*
         * ======================================
         * LOAD DATA
         * ======================================
         */

        async function loadLocations() {


            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                "Mengambil data lokasi...";


            try {


                /*
                 * Ambil data dari backend
                 */

                const response =
                    await fetch(
                        "/api/locations"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Gagal mengambil data."
                    );

                }


                const locations =
                    await response.json();


                /*
                 * Server aktif
                 */

                document.getElementById(
                    "serverStatus"
                ).textContent =
                    "Aktif";


                /*
                 * Jumlah lokasi
                 */

                document.getElementById(
                    "totalLocations"
                ).textContent =
                    locations.length;


                /*
                 * Bersihkan marker lama
                 */

                markerLayer.clearLayers();


                /*
                 * Bersihkan tabel
                 */

                const table =
                    document.getElementById(
                        "locationTable"
                    );


                table.innerHTML = "";


                /*
                 * Jika belum ada data
                 */

                if (
                    locations.length === 0
                ) {

                    status.textContent =
                        "Belum ada data lokasi.";

                    return;

                }


                /*
                 * ==================================
                 * BUAT MARKER
                 * ==================================
                 */

                locations.forEach(
                    function(
                        location,
                        index
                    ) {


                        const latitude =
                            location.latitude;


                        const longitude =
                            location.longitude;


                        /*
                         * Marker
                         */

                        const marker =
                            L.marker([
                                latitude,
                                longitude
                            ]);


                        /*
                         * Popup
                         */

                        marker.bindPopup(

                            `
                            <b>Lokasi ${index + 1}</b>
                            <br>
                            Latitude:
                            ${latitude}
                            <br>
                            Longitude:
                            ${longitude}
                            <br>
                            Waktu:
                            ${formatDate(
                                location.timestamp
                            )}
                            `

                        );


                        marker.addTo(
                            markerLayer
                        );


                        /*
                         * ==================================
                         * TABEL
                         * ==================================
                         */

                        const row =
                            document.createElement(
                                "tr"
                            );


                        row.innerHTML = `

                            <td>
                                ${index + 1}
                            </td>

                            <td>
                                ${latitude}
                            </td>

                            <td>
                                ${longitude}
                            </td>

                            <td>
                                ${formatDate(
                                    location.timestamp
                                )}
                            </td>

                        `;


                        table.appendChild(
                            row
                        );

                    }
                );


                /*
                 * ==================================
                 * PUSATKAN PETA
                 * ==================================
                 */

                if (
                    locations.length === 1
                ) {

                    map.setView(

                        [
                            locations[0].latitude,
                            locations[0].longitude
                        ],

                        15

                    );

                }

                else {


                    const bounds =
                        locations.map(
                            function(location) {

                                return [

                                    location.latitude,

                                    location.longitude

                                ];

                            }
                        );


                    map.fitBounds(
                        bounds,
                        {
                            padding: [30, 30]
                        }
                    );

                }


                status.textContent =
                    "Data berhasil dimuat.";

            }


            catch(error) {


                console.error(
                    error
                );


                document.getElementById(
                    "serverStatus"
                ).textContent =
                    "Error";


                status.textContent =
                    "Gagal mengambil data dari server.";

            }

        }


        /*
         * ======================================
         * FORMAT TANGGAL
         * ======================================
         */

        function formatDate(
            timestamp
        ) {


            if (!timestamp) {

                return "-";

            }


            const date =
                new Date(timestamp);


            return date.toLocaleString(
                "id-ID"
            );

        }


        /*
         * ======================================
         * JALANKAN OTOMATIS
         * ======================================
         */

        loadLocations();


    </script>


</body>

</html>
